name: Release Workflows

# 版は人が決める。リリースの単位で起動し、出した版のタグは二度と動かさない
on:
  workflow_dispatch:
    inputs:
      version:
        description: 出す版 (例 v1.1.0)
        required: true
        type: string

concurrency:
  group: release-workflows
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版は vX.Y.Z の形で指定する: $VERSION"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION は出し済み。出した版は動かさない"; exit 1
          fi

      # 出す版は master の今のコミットに付ける。出した版のタグは動かさない
      - name: Tag
        run: |
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
          echo "${VERSION} を $(git rev-parse --short HEAD) に付けた" >> "$GITHUB_STEP_SUMMARY"
