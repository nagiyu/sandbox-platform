name: Release Workflows

# 版は人が決める。リリースの単位で起動し、出した版のタグは二度と動かさない
on:
  workflow_dispatch:
    inputs:
      version:
        description: 出す版 (例 v1.1.0)
        required: true
        type: string

concurrency:
  group: release-workflows
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版は vX.Y.Z の形で指定する: $VERSION"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION は出し済み。出した版は動かさない"; exit 1
          fi

      # workflow から platform 自身の action を呼ぶ参照は、出す版を指していないと別の版の action が動く。
      # 版は master のコードに書けないので、参照を書き換えたコミットを作り、そこにタグを付ける (master には戻さない)
      - name: Pin self references and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          grep -rl 'nagiyu/sandbox-platform/.github/actions/[^@]*@master' .github/workflows \
            | xargs -r sed -i -E "s#(nagiyu/sandbox-platform/.github/actions/[^@]+)@master#\1@${VERSION}#g"
          git commit -am "${VERSION} をリリースする" || true
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
          echo "${VERSION} を $(git rev-parse --short HEAD) に付けた" >> "$GITHUB_STEP_SUMMARY"
