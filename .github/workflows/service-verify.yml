name: Service Verify (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node のバージョン
        type: string
        default: '22'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # platform の action を呼ぶと、その参照の版をこの workflow の版と揃える必要があり、master のコードに版を書けない。
      # なので action を呼ばず、同じ手順をここに持つ
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: '@nagiyu'

      # テンプレートから作った直後のリポジトリには lockfile が無いので、そのときだけ install にする
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      # どの版の platform 資産で検証したかを、run の画面で見られるようにする
      - name: Report platform versions
        run: |
          {
            echo '## platform の版'
            echo
            echo "- Node: $(node -v)"
            echo
            echo '```'
            npm ls --depth=0 2>/dev/null | grep '@nagiyu/' || echo '(@nagiyu のパッケージを使っていない)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
