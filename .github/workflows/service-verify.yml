name: Service Verify (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node のバージョン
        type: string
        default: '22'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # reusable workflow の中の ./ は呼び出し側のリポジトリを指すので、platform の action はリポジトリ名で参照する。
      # master では @master にしておき、リリースのときに release-workflows.yml がその版へ書き換える
      - uses: nagiyu/sandbox-platform/.github/actions/setup-node@master
        with:
          node-version: ${{ inputs.node-version }}
          token: ${{ github.token }}

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      # どの版の platform 資産で検証したかを、run の画面で見られるようにする
      - name: Report platform versions
        run: |
          {
            echo '## platform の版'
            echo
            echo '```'
            npm ls --depth=0 2>/dev/null | grep '@nagiyu/' || echo '(@nagiyu のパッケージを使っていない)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
