name: Move Major Tag

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/service-verify.yml'
      - '.github/actions/**'
  workflow_dispatch:

# サービスは @v1 のようにメジャーのタグで参照するので、互換を保つ変更はこのタグを動かすだけで全サービスへ届く。
# 互換を壊す変更のときは MAJOR を次の番号に変える。古いタグはその時点で止まり、追従していないサービスはそのまま動く。
env:
  MAJOR: v1

concurrency:
  group: move-major-tag
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move tag
        run: |
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
          echo "${MAJOR} を ${GITHUB_SHA} に動かした" >> "$GITHUB_STEP_SUMMARY"
