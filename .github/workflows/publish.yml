name: Publish Packages

# リリースの単位で人が起動する。version を上げていないパッケージは飛ばす。
# 中身は別のリポジトリの reusable workflow が持つ。trusted publishing はこのファイル名 (publish.yml) で照合される
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: nagiyu/sandbox-service-template/.github/workflows/npm-publish.yml@master
    with:
      package-dirs: packages/*/
